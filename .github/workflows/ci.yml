name: Bump and Publish
on:
  push:
    branches: [main]

jobs:
  build-bump-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'yarn'

      # 1. Install dependencies
      - run: yarn install --frozen-lockfile

      # 2. Configure Git for the bump
      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      # 3. Bump version (patch), commit, and tag
      - name: Bump Version
        id: bump_version
        run: |
          npm version patch -m "chore: bump version to %s"
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      # 4. Push the new version and tag back to GitHub
      - name: Push changes
        run: git push --follow-tags

      # 5. Package Plugin and Storefront Examples for Release
      - name: Package Release Assets
        run: |
          mkdir -p assets
          zip -r assets/storefront-examples.zip storefront
          yarn build
          yarn pack --filename assets/medusajs-repairshop-plugin-v${{ env.VERSION }}.tgz

      # 6. Extract Release Notes
      - name: Extract Release Notes
        run: awk '/^### v/ { if (p) { exit }; p=1; next } p' README.md > release_notes.md

      # 7. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            assets/storefront-examples.zip
            assets/medusajs-repairshop-plugin-v${{ env.VERSION }}.tgz

      # 7. Publish to npm using your secret token
      - name: Publish to npm
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
